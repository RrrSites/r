<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Redirecting...</title>
<script>
  var id = new URLSearchParams(location.search).get("id");
  if (id) {
    fetch("links.json?v=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (map) {
        var dest = map[id];
        if (dest) {
          location.replace(dest);
        }
      })
      .catch(function () {});
  }
</script>
</head>
<body></body>
</html>
